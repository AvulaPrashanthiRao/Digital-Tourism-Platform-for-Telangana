<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:40px;
            width:400px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h1{
            margin-bottom:30px;
        }

        input{
            width:100%;
            padding:12px;
            margin:12px 0;
            border:1px solid #ccc;
            border-radius:4px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#0f5c4d;
            color:white;
            border:none;
            border-radius:4px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0c4b3f;
        }

        p{
            margin-top:15px;
        }

        a{
            color:#0f5c4d;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>User Login</h1>

        <form action="/login" method="POST">

            <input type="email"
                   name="email"
                   placeholder="Enter Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Register</a>
        </p>
    </div>

</body>
</html>
